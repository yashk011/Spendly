{% extends "base.html" %}
{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add Expense</h1>
            <p class="auth-subtitle">Record a new expense to your account.</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('add_expense') }}">

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input class="form-input" type="text" id="amount" name="amount"
                           placeholder="e.g. 499" value="{{ amount or '' }}" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select class="form-input" id="category" name="category">
                        <option value="" disabled {% if not category %}selected{% endif %}>Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if cat == category %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input class="form-input" type="date" id="date" name="date"
                           value="{{ date or today }}">
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="form-optional">(optional)</span></label>
                    <textarea class="form-input form-textarea" id="description" name="description"
                              placeholder="e.g. Grocery run at D-Mart" maxlength="200"
                              rows="3">{{ description or '' }}</textarea>
                </div>

                <button class="btn-submit" type="submit">Add Expense</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">&larr; Back to profile</a>
        </p>

    </div>
</section>
{% endblock %}

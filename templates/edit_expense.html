{% extends "base.html" %}
{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit Expense</h1>
            <p class="auth-subtitle">Update the details of your expense.</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('edit_expense', id=expense.id) }}">

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input class="form-input" type="text" id="amount" name="amount"
                           placeholder="e.g. 499"
                           value="{{ amount if amount is defined else expense.amount }}"
                           autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select class="form-input" id="category" name="category">
                        <option value="" disabled>Select a category</option>
                        {% set selected_cat = category if category is defined else expense.category %}
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if cat == selected_cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input class="form-input" type="date" id="date" name="date"
                           value="{{ date if date is defined else expense.date }}">
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="form-optional">(optional)</span></label>
                    <textarea class="form-input form-textarea" id="description" name="description"
                              placeholder="e.g. Grocery run at D-Mart" maxlength="200"
                              rows="3">{{ description if description is defined else (expense.description or '') }}</textarea>
                </div>

                <button class="btn-submit" type="submit">Update Expense</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">&larr; Back to profile</a>
        </p>

    </div>
</section>
{% endblock %}
